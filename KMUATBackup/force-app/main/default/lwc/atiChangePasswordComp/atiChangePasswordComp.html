<template>
    <lightning-card >
        <div class="slds-p-around_medium">
           
            <lightning-input
                type="password"
                label="Current Password"
                value={currentPassword}
                onchange={handleInputChange}
                data-field="currentPassword"
                required
            ></lightning-input>

            <lightning-input
                type="password"
                label="New Password"
                value={newPassword}
                onchange={handleInputChange}
                data-field="newPassword"
                required
            ></lightning-input>

            <lightning-input
                type="password"
                label="Verify New Password"
                value={verifyNewPassword}
                onchange={handleInputChange}
                data-field="verifyNewPassword"
                required
            ></lightning-input><br>

            <lightning-button
                label="Change Password"
                variant="brand"
                onclick={handleChangePassword}
                class="slds-m-top_medium"
            ></lightning-button>
        </div>
    </lightning-card>
</template>
