<template>
    <lightning-layout multiple-rows="true" class="slds-box slds-theme_shade">

        <lightning-layout-item padding="around-small" size="12">
            <lightning-layout>
                <lightning-layout-item padding="around-small" size="3">
                    <lightning-input type="text" label="Name Search" value={filter}
                        onchange={handleFilterChange}></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item padding="around-small" size="3" padding-top="10px">
                    <div class="slds-align_absolute-center slds-m-around_small">
                        <lightning-button variant="brand" label="Search" title="Submit" onclick={handleClick}
                            class="slds-m-left_x-small"></lightning-button>
                    </div>
                </lightning-layout-item>

                <lightning-layout-item padding="around-small" size="3">
                    <lightning-combobox name="Rating" label="Rating" value={value} placeholder="Select Rating"
                        options={ratingOptions} onchange={handleRatingChange}>
                    </lightning-combobox>
                </lightning-layout-item>
                <lightning-layout-item padding="around-small" size="3">
                    <div class="slds-form-element">
                        <label class="slds-form-element__label" for="text-input-id-1">Input Label</label>
                        <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon_right">
                            <lightning-icon size="x-small"
                                class="slds-icon slds-input__icon slds-input__icon_right slds-icon-text-default"
                                icon-name="utility:search"></lightning-icon>
                            <input type="text" id="text-input-id-1" placeholder="Placeholder Text" class="slds-input" />
                        </div>
                    </div>
                </lightning-layout-item>
            </lightning-layout>
        </lightning-layout-item>


        <lightning-layout-item padding="around-small" size="12">
            <lightning-layout>
                <lightning-layout-item padding="around-small" size="6">
                    <lightning-input type="date" name="fromDate" label="From Date" value="2020-09-07T00:00:00Z"
                        onchange={handleFromDateChange}></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item padding="around-small" size="6">
                    <lightning-input type="date" name="toDate" label="ToDate" value="2020-09-07T00:00:00Z"
                        onchange={handleToDateChange}></lightning-input>
                </lightning-layout-item>
            </lightning-layout>
        </lightning-layout-item>
        <lightning-layout-item padding="around-small" size="12">
            <div class="slds-align_absolute-center slds-m-around_small">
                <lightning-button variant="brand" label="Query" title="Submit" onclick={handleClick}
                    class="slds-m-left_x-small"></lightning-button>
            </div>
        </lightning-layout-item>
        <lightning-layout-item padding="around-small" size="12">
            <c-data-table-wrapper object-name={objectNameToSend} fields-to-query={fieldNamesToSend}
                filters={filtersToSend} records-per-page={recordsPerPageToSend} disable-sort={disableSortToSend}
                disable-search={disableSearchToSend}></c-data-table-wrapper>
            <!--<c-data-table-wrapper object-name="Opportunity" fields-to-query="Name, Type, StageName, CloseDate, Account.Name" filters="Name != null" records-per-page="20" disable-sort disable-search></c-data-table-wrapper>-->
        </lightning-layout-item>
    </lightning-layout>
</template>
